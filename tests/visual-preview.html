<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>改字视觉检查</title><style>@font-face{font-family:ReferenceRoboto;src:url('/fonts/Roboto.ttf');font-weight:100 900}body{margin:12px;font:14px system-ui}section{display:flex;gap:12px}figure{margin:10px 0;width:calc(50% - 6px)}canvas,img{width:100%;height:auto}select{width:100%;padding:8px}figcaption{text-align:center;margin:6px}</style><select id="template" aria-label="检查模板"></select><p id="status"></p><section><figure><figcaption>原图</figcaption><img id="source"></figure><figure><figcaption>修改字段后</figcaption><canvas id="result"></canvas></figure></section>
<script type="module">
import {templates} from '/src/reference-data.mjs';import {renderReference} from '/src/reference-renderer.mjs';
const select=document.querySelector('select');for(const t of templates){const o=document.createElement('option');o.value=t.id;o.textContent=t.label;select.append(o);}
async function draw(){const t=templates.find(t=>t.id===select.value),v=Object.fromEntries(Object.entries(t.fields).map(([key,f])=>[key,f.value]));document.querySelector('#source').src=t.src;for(const [key,f]of Object.entries(t.fields)){if(f.type==='image')continue;v[key]=f.type==='amount'?'1234':f.type==='battery'?'80':f.type==='datetime-local'?'2026-10-11T12:34':key==='time'?'12:34':key.includes('Initials')?'TS':['started','transferred','depositing'].includes(key)?'':key==='recipient'?'Arun Sharma':key==='sender'?'Kiran Kumar':key==='transaction'?'123456789012':key==='senderBank'?'Test Bank - 1234':'Test '+key;}try{await renderReference(document.querySelector('#result'),t,v);document.querySelector('#status').textContent='完成';}catch(e){document.querySelector('#status').textContent=e.message;}}select.onchange=draw;draw();
</script></html>
